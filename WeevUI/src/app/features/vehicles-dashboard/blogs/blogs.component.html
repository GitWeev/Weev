<div class="blog-section">
  <div class="container">
    <h2 class="section-title">Latest Articles</h2>
    
    <!-- Carousel Container -->
    <div class="carousel-container" 
         (mouseenter)="onMouseEnter()" 
         (mouseleave)="onMouseLeave()"
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd($event)"
         (pan)="onPan($event)"
         (panend)="onPanEnd($event)">
      
      <!-- Navigation Arrows -->
      <button class="nav-arrow nav-arrow-prev" 
              (click)="prevSlide()" 
              [class.disabled]="currentSlide === 0"
              [class.hidden-mobile]="true"
              aria-label="Previous slide">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      
      <button class="nav-arrow nav-arrow-next" 
              (click)="nextSlide()" 
              [class.disabled]="currentSlide >= getMaxSlides()"
              [class.hidden-mobile]="true"
              aria-label="Next slide">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      </button>
            
      <!-- Carousel Track -->
      <div class="carousel-track" 
           [style.transform]="'translateX(' + (-(currentSlide * (100 / cardsPerView))) + '%)'">
        <div class="blog-card" 
             *ngFor="let blog of blogs; trackBy: trackByBlogId" 
             (click)="openBlog(blog.id)"
             [style.flex]="'0 0 ' + (100 / cardsPerView) + '%'">
          <div class="card-image-container">
            <img [src]="blog.image" [alt]="blog.title" class="card-image">
            <div class="card-date">
              <span class="date-day">{{ blog.date.split(' ')[0] }}</span>
              <span class="date-month">{{ blog.date.split(' ')[1] }}</span>
            </div>
          </div>
          <div class="card-content">
            <div class="card-meta">
              <span class="card-author">By {{ blog.author }}</span>
              <span class="card-category">{{ blog.category }}</span>
            </div>
            <h3 class="card-title">{{ blog.title }}</h3>
            <p class="card-excerpt">{{ blog.excerpt }}</p>
            <a class="read-more-link">
              Continue Reading
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="M12 5l7 7-7 7"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
      
      <!-- Pagination Dots -->
      <div class="carousel-pagination">
        <button *ngFor="let dot of [].constructor(getMaxSlides() + 1); let i = index" 
                class="pagination-dot" 
                [class.active]="i === currentSlide"
                (click)="currentSlide = i"
                [attr.aria-label]="'Go to slide ' + (i + 1)">
        </button>
      </div>
    </div>
    
    <!-- Carousel Indicators (Optional - Shows current position) -->
    <div class="carousel-info">
      <span class="slide-counter">
        {{ currentSlide + 1 }} / {{ getMaxSlides() + 1 }}
      </span>
    </div>
  </div>
</div>
